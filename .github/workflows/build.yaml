name: Flutter Auto-Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------
  # 1. BUDOWANIE DLA ANDROIDA I LINUXA (push na main)
  # ---------------------------------------------------
  build-android-linux:
    name: Build Android & Linux
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Konfiguracja Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalacja zależności Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev jq libsecret-1-dev libjsoncpp-dev libasound2-dev libmpv-dev lld

      - name: Konfiguracja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Przygotowanie plików z Twoich GitHub Secrets
      - name: Odtwórz plik .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Odtwórz Keystore i właściwości
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/app/key.properties

      - name: Pobieranie paczek (pub get)
        run: flutter pub get

      # Budowanie wszystkich wersji Androida
      - name: Budowanie Android APK
        run: flutter build apk --release

      - name: Budowanie Android App Bundle
        run: flutter build appbundle --release

      # Budowanie wersji na Linuxa
      - name: Budowanie Linux App
        run: flutter build linux --release

      # --- UDOSTĘPNIANIE ARTEFAKTÓW ---
      
      - name: Zapamiętaj plik APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Zapamiętaj plik App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Android-AppBundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Zapamiętaj paczkę Linux
        uses: actions/upload-artifact@v4
        with:
          name: Linux-App
          path: build/linux/x64/release/bundle/

  # ---------------------------------------------------
  # 2. RELEASE - APK bez Android SDK + GitHub Release
  # ---------------------------------------------------
  release:
    name: Release APK (no SDK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Pominięto: Konfiguracja Android SDK (używa pre-instalowanego SDK)

      - name: Konfiguracja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Odtwórz plik .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Odtwórz Keystore i właściwości
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/app/key.properties

      - name: Pobieranie paczek (pub get)
        run: flutter pub get

      - name: Budowanie APK
        run: flutter build apk --release

      - name: Zapamiętaj plik APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Utwórz GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JellyDawtyl ${{ github.ref_name }}
          body: |
            ## JellyDawtyl ${{ github.ref_name }}

            Automatycznie zbudowane wydanie z najnowszymi zmianami.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false